[project]
name = "pylearn"
version = "0.1.0"
description = "A sandbox for learning Python"
readme = "README.md"
authors = [
    { name = "Taras Sytnyk", email = "t.sytnyk@andersenlab.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
pylearn = "pylearn:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: errors, I: import order, UP: modern syntax, B: common bugs
select = ["E", "F", "I", "UP", "B"]
